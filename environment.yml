name: vlm_ftune
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9.7
  - cudatoolkit=11.8
  - pip
  - ipykernel
  - pip:
      # PyTorch CUDA builds are NOT on PyPI. Without this line the +cu118 pins
      # below cannot resolve and `conda env create -f environment.yml` fails.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      # Core ML
      - torch==2.6.0+cu118
      - torchvision==0.21.0+cu118
      - torchaudio==2.6.0+cu118
      - transformers==4.51.0
      # accelerate is REQUIRED, not optional: without it transformers 4.51
      # raises `NameError: init_empty_weights` when loading Florence-2.
      - accelerate==1.6.0
      # einops is imported by Florence-2's trust_remote_code modeling file.
      - einops==0.8.2
      # The YOLO track needs ultralytics; it was missing from this file, so the
      # YOLO entry point could not run from a fresh env. Verified with 8.4.127
      # (the Phase-3 runs used an unrecorded 8.x, so this is a Phase-4 pin).
      # NOTE: ultralytics auto-installs `clip` the first time set_classes() is
      # called, and that downloads ViT-B-32.pt (338 MB) into ./weights/clip/
      # (gitignored). Expect that one-off download on a new machine.
      - ultralytics==8.4.127
      - timm==1.0.15
      - safetensors==0.5.3
      # Data & evaluation
      - numpy==2.0.2
      - pandas==2.2.3
      - pycocotools==2.0.8
      - pycocoevalcap==1.2
      - datasets==3.5.0
      # Image processing & defenses
      - pillow==11.1.0
      - opencv-python==4.13.0.92
      - scikit-image==0.24.0
      - diffusers==0.36.0
      # Optional: enables the real BM3D survey-defense row (else it is dropped
      # with a warning — never reported as a mislabeled Gaussian fallback).
      - bm3d==4.0.3
      # Visualization & utilities
      - matplotlib==3.9.4
      - tqdm==4.67.1
      - GPUtil==1.4.0
      # Jupyter
      - notebook==7.3.3
      - nbconvert==7.16.6
      - nbformat==5.10.4
      - ipywidgets==8.1.5
